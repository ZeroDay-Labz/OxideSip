    <radialGradient id="glow" cx="0.32" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#ff7a3d" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa070"/>
