[package]
name = "softphone-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true

# The installed/distributed program is "OxideSip" (lowercase `oxidesip` for
# the actual binary, matching standard Unix CLI naming); `softphone-ui`
# stays the internal crate name, consistent with its `softphone-core`/
# `softphone-media` workspace siblings.
[[bin]]
name = "oxidesip"
path = "src/main.rs"

[dependencies]
softphone-core = { path = "../softphone-core" }
softphone-media = { path = "../softphone-media" }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.9"
iced = { version = "0.14", features = ["tokio"] }
rfd = "0.17.2"
dirs = "6.0.0"

# --- Phase 4 (future work) ---
# zbus = "5.18"          # StatusNotifierItem tray service, minimize-to-tray on close
# notify-rust = "4.18"   # KDE/libnotify call popups

# Consumed by `cargo generate-rpm` (see .github/workflows/release.yml) to
# build a Fedora-installable RPM from the release binary. Deliberately
# doesn't set `auto-req`/`requires` here — leaving the tool's default
# ldd-based dependency discovery on picks up the real shared-library
# requirements (libpipewire, etc.) from whatever binary was actually built,
# which is more accurate than a hand-maintained package-name list.
[package.metadata.generate-rpm]
assets = [
    { source = "../target/release/oxidesip", dest = "/usr/bin/oxidesip", mode = "755" },
    { source = "../flatpak/io.github.zerodaylabz.OxideSip.desktop", dest = "/usr/share/applications/io.github.zerodaylabz.OxideSip.desktop", mode = "644" },
    { source = "../flatpak/io.github.zerodaylabz.OxideSip.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.zerodaylabz.OxideSip.svg", mode = "644" }
]

name = "oxidesip"
assets = [
    { source = "target/release/oxidesip", dest = "/usr/bin/oxidesip", mode = "755" },
]

